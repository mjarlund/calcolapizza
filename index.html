<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Dough Calculator · Pizzadejsberegner · Pizzateig-Rechner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
<style>
  :root {
    --bg: #faf8f4; --panel: #fff; --ink: #1d1a16; --muted: #6f6659;
    --line: #e3ddd2; --accent: #b3341f; --accent-soft: #f6e7e3; --bad: #b3341f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --panel: #1c1916; --ink: #f2ece2; --muted: #a1968a;
      --line: #2e2a25; --accent: #e2603f; --accent-soft: #2a1d18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 28px 20px 64px; }
  .top { display: flex; align-items: flex-start; gap: 16px; justify-content: space-between; }
  header h1 { font-size: 1.55rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0 0 22px; color: var(--muted); font-size: 0.95rem; max-width: 60ch; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
  .lang button {
    font: inherit; font-size: 0.82rem; padding: 6px 12px; border: 0; cursor: pointer;
    background: var(--panel); color: var(--muted); letter-spacing: 0.02em;
  }
  .lang button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .grid { display: grid; gap: 20px; grid-template-columns: 1.35fr 1fr; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .top { flex-direction: column-reverse; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 20px; }
  .card h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr 132px; gap: 10px; align-items: center; padding: 7px 0; }
  .row label { font-size: 0.93rem; }
  .row .hint { display: block; color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
  input[type="number"] {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[data-invalid="true"] { border-color: var(--bad); background: var(--accent-soft); }
  fieldset { border: 0; margin: 0; padding: 0; }
  .seg { display: flex; gap: 6px; }
  .seg label { flex: 1; text-align: center; padding: 7px 4px; font-size: 0.86rem; cursor: pointer;
    border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: var(--bg); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .seg[data-inert="true"] { opacity: 0.45; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0 2px; }
  .check input { margin-top: 3px; accent-color: var(--accent); }
  .check span { font-size: 0.9rem; }
  .check .hint { color: var(--muted); font-size: 0.78rem; display: block; }
  .out { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .out div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--panel); font-variant-numeric: tabular-nums; }
  .out div span:first-child { color: var(--muted); }
  .out div span:last-child { font-weight: 600; }
  .out .lead span:first-child { color: var(--ink); font-weight: 600; }
  .out .lead span:last-child { color: var(--accent); font-size: 1.12rem; }
  .total { margin-top: 12px; color: var(--muted); font-size: 0.85rem; display: flex; justify-content: space-between; }
  .err { margin-top: 10px; color: var(--bad); font-size: 0.85rem; min-height: 1.2em; }
  footer { margin-top: 28px; color: var(--muted); font-size: 0.82rem; line-height: 1.6; }
  footer a { color: inherit; }
  details { margin-top: 18px; }
  summary { cursor: pointer; font-size: 0.85rem; color: var(--muted); }
  details p { font-size: 0.84rem; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .actions button, .linkish {
    font: inherit; font-size: 0.82rem; padding: 7px 12px; border-radius: 9px; cursor: pointer;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  }
  .actions button:hover, .actions button:focus-visible { border-color: var(--accent); color: var(--accent); }
  .equiv { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: var(--bg); font-size: 0.82rem; padding: 9px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @page { size: A4; margin: 12mm; }
  @media print {
    /* One sheet, nothing spilling onto a second page. */
    .lang, .actions, .toast, dialog, #resetBtn, details, .savedLine { display: none !important; }
    html, body { background: #fff; color: #000; font-size: 10.5pt; line-height: 1.35; }
    main { max-width: none; padding: 0; }
    header { margin-bottom: 6mm; }
    header h1 { font-size: 16pt; margin: 0 0 1mm; }
    header p { font-size: 9pt; margin: 0; max-width: none; }
    .top { display: block; }
    .grid { grid-template-columns: 1fr 1fr; gap: 6mm; align-items: start; }
    .card { border: 1px solid #999; border-radius: 4mm; padding: 3mm 4mm; break-inside: avoid; }
    .card h2 { font-size: 7.5pt; margin: 0 0 2mm; }
    .card h2[style] { margin-top: 4mm !important; }
    .row { padding: 1.1mm 0; grid-template-columns: 1fr 24mm; gap: 3mm; }
    .row label { font-size: 9.5pt; }
    .hint { display: none; }
    input[type="number"] {
      border: 0; background: none; padding: 0; font-weight: 600; font-size: 10.5pt;
      border-radius: 0; width: auto; text-align: right;
    }
    /* No stepper arrows on paper. */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; display: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    .seg label { padding: 1mm 2mm; font-size: 8.5pt; border-radius: 2mm; }
    .check { padding: 2mm 0 0; font-size: 9pt; }
    .check .hint { display: none; }
    .out div { padding: 1.3mm 3mm; font-size: 10pt; }
    .out .lead span:last-child { font-size: 12pt; }
    .total { margin-top: 2mm; font-size: 8.5pt; }
    .equiv { margin-top: 1.5mm; font-size: 8pt; }
    .err { margin-top: 1mm; }
    footer { margin-top: 5mm; font-size: 7.5pt; line-height: 1.35; }
    footer p { margin: 0 0 1.5mm; }
    footer p:nth-child(n+2) { display: none; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <header>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </header>
    <div class="lang" role="group" aria-label="Language / Sprog">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="da">Dansk</button>
      <button type="button" data-lang="de">Deutsch</button>
    </div>
  </div>

  <div class="grid">
    <section class="card">
      <h2 data-i18n="secDough"></h2>

      <div class="row">
        <label for="balls"><span data-i18n="balls"></span><span class="hint" data-i18n="ballsHint"></span></label>
        <input id="balls" type="number" min="1" step="1" value="1" inputmode="numeric">
      </div>
      <div class="row">
        <label for="ballWeight"><span data-i18n="ballWeight"></span><span class="hint" data-i18n="ballWeightHint"></span></label>
        <input id="ballWeight" type="number" min="1" step="10" value="200" inputmode="decimal">
      </div>
      <div class="row">
        <label for="hydration"><span data-i18n="hydration"></span><span class="hint" data-i18n="hydrationHint"></span></label>
        <input id="hydration" type="number" min="50" max="100" step="1" value="65" inputmode="decimal">
      </div>
      <div class="row">
        <label for="saltPerLitre"><span data-i18n="salt"></span><span class="hint" data-i18n="saltHint"></span></label>
        <input id="saltPerLitre" type="number" min="0" max="70" step="1" value="50" inputmode="decimal">
      </div>
      <div class="row">
        <label for="fatPerLitre"><span data-i18n="fat"></span><span class="hint" data-i18n="fatHint"></span></label>
        <input id="fatPerLitre" type="number" min="0" max="150" step="1" value="0" inputmode="decimal">
      </div>

      <h2 style="margin-top:22px" data-i18n="secLeaven"></h2>

      <div class="row">
        <label for="hours"><span data-i18n="hours"></span><span class="hint" data-i18n="hoursHint"></span></label>
        <input id="hours" type="number" min="3" max="96" step="1" value="24" inputmode="numeric">
      </div>
      <div class="row">
        <label for="fridgeHours"><span data-i18n="fridge"></span><span class="hint" data-i18n="fridgeHint"></span></label>
        <input id="fridgeHours" type="number" min="0" step="1" value="0" inputmode="numeric">
      </div>
      <div class="row">
        <label for="roomTemp"><span data-i18n="temp"></span><span class="hint" data-i18n="tempHint"></span></label>
        <input id="roomTemp" type="number" min="15" max="35" step="0.5" value="20" inputmode="decimal">
      </div>

      <div class="check">
        <input id="panPizza" type="checkbox">
        <span><span data-i18n="pan"></span><span class="hint" data-i18n="panHint"></span></span>
      </div>

      <h2 style="margin-top:22px" data-i18n="secCarry"></h2>

      <div class="row">
        <label for="carryOver"><span data-i18n="carry"></span><span class="hint" data-i18n="carryHint"></span></label>
        <input id="carryOver" type="number" min="0" step="1" value="0" inputmode="decimal">
      </div>

      <fieldset>
        <div class="row" style="grid-template-columns: 1fr; padding-bottom:0">
          <label style="margin-bottom:6px"><span data-i18n="vigour"></span><span class="hint" data-i18n="vigourHint"></span></label>
          <div class="seg">
            <label><input type="radio" name="vigour" value="1"><span data-i18n="sluggish"></span></label>
            <label><input type="radio" name="vigour" value="2" checked><span data-i18n="normal"></span></label>
            <label><input type="radio" name="vigour" value="3"><span data-i18n="lively"></span></label>
          </div>
        </div>
      </fieldset>

      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:16px">
        <span class="hint savedLine" data-i18n="saved" style="font-size:0.76rem"></span>
        <button type="button" id="resetBtn" data-i18n="reset"
          style="font:inherit;font-size:0.78rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;flex:none"></button>
      </div>
    </section>

    <section class="card" aria-live="polite">
      <h2 data-i18n="secOut"></h2>
      <div class="out">
        <div class="lead"><span data-i18n="oFlour"></span><span id="outFlour">—</span></div>
        <div><span data-i18n="oWater"></span><span id="outWater">—</span></div>
        <div><span data-i18n="oSalt"></span><span id="outSalt">—</span></div>
        <div><span data-i18n="oFat"></span><span id="outFat">—</span></div>
        <div><span data-i18n="oCarry"></span><span id="outCarry">—</span></div>
        <div class="lead"><span data-i18n="oYeast"></span><span id="outYeast">—</span></div>
      </div>
      <div class="total"><span data-i18n="totalLabel"></span><span id="outTotal">—</span></div>
      <div class="total"><span data-i18n="strengthLabel"></span><span id="outStrength">—</span></div>
      <div class="equiv" id="yeastExtraNote"></div>
      <div class="equiv" id="yeastEquiv">—</div>
      <div class="err" id="errorLine"></div>
      <div class="actions">
        <button type="button" id="copyLinkBtn" data-i18n="copyLink"></button>
        <button type="button" id="copyRecipeBtn" data-i18n="copyRecipe"></button>
      </div>

      <details>
        <summary data-i18n="strengthSummary"></summary>
        <p id="strengthNote">—</p>
      </details>
    </section>
  </div>

  <footer>
    <p data-i18n="credit"></p>
    <p data-i18n="yeastNote"></p>
    <p data-i18n="weightNote"></p>
  </footer>
</main>
<dialog id="copyDialog" style="border:1px solid var(--line);border-radius:14px;padding:16px;max-width:min(640px,94vw);background:var(--panel);color:var(--ink)">
  <form method="dialog" style="display:flex;flex-direction:column;gap:10px">
    <strong id="copyDialogTitle" style="font-size:0.95rem"></strong>
    <textarea id="copyDialogText" readonly rows="7"
      style="font:inherit;font-size:0.85rem;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);resize:vertical"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button value="close" id="copyDialogClose" class="linkish" style="font-size:0.82rem;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer"></button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    fridge: '…davon im Kühlschrank', fridgeHint: 'Stunden, 0 bis Gesamtzeit minus 1',
    temp: 'Raumtemperatur', tempHint: '°C, 15–35 (22–24 in einer normalen Küche)',
    pan: 'Im Blech backen (Teglia)',
    panHint: 'Gleicht die andere Gärung im Blech aus: die effektive Raumtemperatur wird um ein Viertel gesenkt.',
    carry: 'Vorgegorener Teig', carryHint: 'Prozent des Gesamtteigs, 0 bis zum angezeigten Grenzwert',
    vigour: 'Triebkraft dieses Teigs', vigourHint: 'Wie aktiv der Restteig ist',
    sluggish: 'Träge', normal: 'Normal', lively: 'Lebhaft',
    reset: 'Auf Standard zurücksetzen', saved: 'Eingaben werden in diesem Browser gespeichert.',
    copyLink: 'Link kopieren', copyRecipe: 'Rezept kopieren', atLeast: 'mindestens',
    copyManually: 'Text unten kopieren', close: 'Schließen',
    copiedLink: 'Link kopiert', copiedRecipe: 'Rezept kopiert', copyFailed: 'Kopieren fehlgeschlagen — bitte manuell markieren',
    yeastEquiv: (dry, inst) => `Entspricht ${dry} g Trockenhefe oder ${inst} g Instanthefe.`,
    yeastLine: (fresh, dry, inst) => `Frische Hefe ${fresh} g (${dry} g Trockenhefe / ${inst} g Instanthefe)`,
    recipeTitle: (n, w) => `Pizzateig — ${n} Teiglinge à ${w} g`,
    recipeSchedule: (h, f, t) => `${h} Std. insgesamt, ${f} Std. kalt${Number(h) - Number(f) > 0 ? `, ${Number(h) - Number(f)} Std. bei ${t} °C` : ''}`,
    oFlour: 'Mehl', oWater: 'Wasser', oSalt: 'Salz', oFat: 'Öl / Fett', oCarry: 'Restteig', oYeast: 'Frische Hefe',
    totalLabel: 'Gesamtteig', strengthLabel: 'Mehlstärke (W)',
    yeastExtra: (t) => `Die Hefe kommt dazu: der Teig selbst wiegt ${t} g.`,
    strengthSummary: 'Warum die Mehlstärke zählt',
    check: 'Prüfen: ',
    carryLimit: (n) => `Restteig muss zwischen 0 und ${n} % liegen.`,
    credit: 'Die Berechnung wurde von Il Calcolapizza 2.1 (laconfraternitadellapizza.net/calcolapizza) von La Confraternita della Pizza übernommen. Diese Seite ist eine unabhängige Übertragung der Methode und steht in keiner Verbindung zu ihnen — der Dank für die Formeln und das Hefemodell gebührt der Confraternita und den Forummitgliedern, denen sie danken.',
    yeastNote: 'Nur frische Hefe: der Rechner gibt Hefe als frische/komprimierte Hefe an (lievito di birra fresco). Für Trockenhefe: durch 3 teilen bei aktiver Trockenhefe, durch 3,5 bei Instanthefe.',
    weightNote: 'Die Hefe kommt zusätzlich zum gewünschten Teiggewicht dazu — Mehl, Wasser, Salz, Fett und Restteig ergeben die Anzahl Teiglinge mal das angegebene Gewicht, die Hefe ist extra.',
    notes: [
      (w) => `W ${w}: kurze Gehzeit, ein normales 00 (W 260–280) reicht.`,
      (w) => `W ${w}: etwa ein Tag Gehzeit; hier liegt ein gutes Allround-Pizzamehl.`,
      (w) => `W ${w}: zwei Tage Gehzeit; ein starkes Mehl verwenden und einen festen, elastischen Teig erwarten.`,
      (w) => `W ${w}: drei Tage oder mehr; sehr starkes Mehl, sonst wird der Teig schlaff, bevor er fertig ist.`,
    ],
  },
};

// ---------------------------------------------------------------- math (port of calcolapizza2.js)
const CARRY_OVER_FACTOR = { 1: 1 / 300, 2: 0.005, 3: 0.01 };

// Inputs are remembered per browser: the same dough gets made again and again.
const SAVE_KEY = 'calcolapizza.inputs';
const FIELDS = ['balls', 'ballWeight', 'hydration', 'saltPerLitre', 'fatPerLitre', 'hours', 'fridgeHours', 'roomTemp', 'carryOver'];
// Exactly the original Calcolapizza 2.1 defaults: 1 ball of 200 g, 65 % hydration,
// 50 g salt per litre, 24 h at 20 °C with nothing in the fridge.
const DEFAULTS = {
  balls: 1, ballWeight: 200, hydration: 65, saltPerLitre: 50, fatPerLitre: 0,
  hours: 24, fridgeHours: 0, roomTemp: 20, carryOver: 0, panPizza: false, vigour: 2,
};

function saveInputs() {
  const state = {};
  for (const id of FIELDS) state[id] = $id(id).value;
  state.panPizza = $id('panPizza').checked;
  state.vigour = document.querySelector('input[name="vigour"]:checked').value;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
}

function restoreInputs() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch {}
  if (!saved || typeof saved !== 'object') return false;
  for (const id of FIELDS) {
    if (saved[id] !== undefined && saved[id] !== null && saved[id] !== '') $id(id).value = String(saved[id]);
  }
  if (typeof saved.panPizza === 'boolean') $id('panPizza').checked = saved.panPizza;
  const vigour = String(saved.vigour || '2');
  document.querySelectorAll('input[name="vigour"]').forEach((radio) => { radio.checked = radio.value === vigour; });
  return true;
}

// A recipe is worth sharing: the whole state lives in the query string too.
const URL_KEYS = { balls: 'n', ballWeight: 'w', hydration: 'h', saltPerLitre: 's',
  fatPerLitre: 'f', hours: 't', fridgeHours: 'c', roomTemp: 'T', carryOver: 'r' };

function currentState() {
  const state = {};
  for (const id of FIELDS) state[id] = $id(id).value;
  state.panPizza = $id('panPizza').checked;
  state.vigour = document.querySelector('input[name="vigour"]:checked').value;
  return state;
}

function applyState(state) {
  for (const id of FIELDS) {
    if (state[id] !== undefined && state[id] !== null && state[id] !== '') $id(id).value = String(state[id]);
  }
  if (typeof state.panPizza === 'boolean') $id('panPizza').checked = state.panPizza;
  const vigour = ['1', '2', '3'].includes(String(state.vigour)) ? String(state.vigour) : '2';
  document.querySelectorAll('input[name="vigour"]').forEach((radio) => { radio.checked = radio.value === vigour; });
}

function stateFromUrl() {
  const params = new URLSearchParams(location.search);
  // Only a link that names a dough quantity is a recipe link; anything else in the
  // query string (a cache buster, a tracking param) must not be read as state.
  if (!params.has('n') && !params.has('w')) return null;
  const state = {};
  for (const [id, key] of Object.entries(URL_KEYS)) if (params.has(key)) state[id] = params.get(key);
  if (params.has('p')) state.panPizza = params.get('p') === '1';
  if (['1', '2', '3'].includes(params.get('v'))) state.vigour = params.get('v');
  return state;
}

function writeUrl() {
  const params = new URLSearchParams();
  const state = currentState();
  for (const [id, key] of Object.entries(URL_KEYS)) params.set(key, state[id]);
  params.set('p', state.panPizza ? '1' : '0');
  params.set('v', state.vigour);
  params.set('l', lang);
  history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
}

function toast(message) {
  const el = $id('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1900);
}

function showManualCopy(text) {
  const t = STRINGS[lang];
  $id('copyDialogTitle').textContent = t.copyManually;
  $id('copyDialogClose').textContent = t.close;
  const area = $id('copyDialogText');
  area.value = text;
  const dialog = $id('copyDialog');
  if (typeof dialog.showModal === 'function') dialog.showModal();
  area.focus();
  area.select();
  area.scrollTop = 0;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    area.remove();
    return ok;
  }
}

function recipeText(r, v) {
  const t = STRINGS[lang];
  const parts = [
    t.recipeTitle(v.balls, v.ballWeight),
    `${t.oFlour} ${r.flour} g · ${t.oWater} ${r.water} g · ${t.oSalt} ${r.salt} g` +
      (r.fat > 0 ? ` · ${t.oFat} ${r.fat} g` : '') +
      (r.carry > 0 ? ` · ${t.oCarry} ${r.carry} g` : ''),
    t.yeastLine(dec(r.yeast.toFixed(2)), dec((r.yeast / 3).toFixed(2)), dec((r.yeast / 3.5).toFixed(2))),
    t.recipeSchedule(v.hours, v.fridgeHours, v.roomTemp),
    `${t.strengthLabel} ${r.strength}`,
  ];
  return parts.join('\n');
}

function resetInputs() {
  for (const id of FIELDS) $id(id).value = String(DEFAULTS[id]);
  $id('panPizza').checked = DEFAULTS.panPizza;
  document.querySelectorAll('input[name="vigour"]').forEach((radio) => { radio.checked = radio.value === String(DEFAULTS.vigour); });
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  render();
}
const num = (el) => parseFloat(String(el.value).replace(',', '.'));
const $id = (id) => document.getElementById(id);
let lang = 'en';

function readInputs() {
  return {
    balls: num($id('balls')),
    ballWeight: num($id('ballWeight')),
    hydration: num($id('hydration')),
    saltPerLitre: num($id('saltPerLitre')),
    fatPerLitre: num($id('fatPerLitre')),
    hours: num($id('hours')),
    fridgeHours: num($id('fridgeHours')),
    roomTemp: num($id('roomTemp')),
    carryOver: num($id('carryOver')),
    panPizza: $id('panPizza').checked,
    vigour: parseInt((document.querySelector('input[name="vigour"]:checked') || { value: '2' }).value, 10),
  };
}

function compute(v) {
  const effectiveTemp = v.roomTemp * (1 - 0.25 * (v.panPizza ? 1 : 0));
  const effectiveHours = v.hours - (9 * v.fridgeHours) / 10;
  const rawStrength = 81.4206918743428 + 78.3939060802556 * Math.log(v.hours);
  const strength = 10 * Math.round(rawStrength / 10);
  const yeastPerFlourGram =
    (2250 * (1 + v.saltPerLitre / 200) * (1 + v.fatPerLitre / 300)) /
    ((4.2 * v.hydration - 80 - 0.0305 * v.hydration * v.hydration) *
      Math.pow(effectiveTemp, 2.5) * Math.pow(effectiveHours, 1.2));
  const totalDough = v.balls * v.ballWeight;
  const denominator = v.hydration * (v.saltPerLitre + v.fatPerLitre) + 1000 * (v.hydration + 100);
  const carryFactor = CARRY_OVER_FACTOR[v.vigour];
  const carryLimitRaw = (1e5 * yeastPerFlourGram * 100) / (1e5 * yeastPerFlourGram + denominator * carryFactor);
  const carryLimit = parseFloat(carryLimitRaw.toString().match(/^\d+(?:\.\d{0,2})?/)[0]);
  const remaining = totalDough - (totalDough * v.carryOver) / 100;
  return {
    strength, carryLimit, totalDough,
    flour: Math.round((1e5 * remaining) / denominator),
    water: Math.round((1000 * v.hydration * remaining) / denominator),
    salt: Math.round((v.saltPerLitre * v.hydration * remaining) / denominator),
    fat: Math.round((v.fatPerLitre * v.hydration * remaining) / denominator),
    carry: Math.round((totalDough * v.carryOver) / 100),
    yeast: ((1e5 * remaining) / denominator) * yeastPerFlourGram - carryFactor * ((totalDough * v.carryOver) / 100),
  };
}

// ---------------------------------------------------------------- rendering
// Danish and German both write decimals with a comma; English does not.
const dec = (n) => (lang === 'en' ? String(n) : String(n).replace('.', ','));
const DASH = '—';

function strengthBand(w) {
  if (w < 270) return 0;
  if (w < 340) return 1;
  if (w < 390) return 2;
  return 3;
}

function render() {
  const t = STRINGS[lang];
  const v = readInputs();
  const ids = ['outFlour', 'outWater', 'outSalt', 'outFat', 'outCarry', 'outYeast', 'outTotal', 'outStrength'];

  const bad = [];
  const mark = (el, isBad) => { el.dataset.invalid = isBad ? 'true' : 'false'; };

  const rules = [
    ['balls', v.balls, 1, undefined, true, ''],
    ['ballWeight', v.ballWeight, 1, undefined, false, ' g'],
    ['hydration', v.hydration, 50, 100, false, ' %'],
    ['saltPerLitre', v.saltPerLitre, 0, 70, false, ' g/l'],
    ['fatPerLitre', v.fatPerLitre, 0, 150, false, ' g/l'],
    ['hours', v.hours, 3, 96, false, ' h'],
    ['roomTemp', v.roomTemp, 15, 35, false, ' °C'],
  ];
  for (const [id, value, min, max, integer, unit] of rules) {
    const isBad = Number.isNaN(value) || value < min || (max !== undefined && value > max) || (integer && !Number.isInteger(value));
    mark($id(id), isBad);
    if (isBad) {
      // Say what is wrong, not just which field: "Hydration (50–100 %)".
      // "50–100 %", not "50 %–100 %".
      const suffix = unit.trim();
      const range = max !== undefined
        ? `${min}–${max}${suffix ? ' ' + suffix : ''}`
        : `${t.atLeast} ${min}${suffix ? ' ' + suffix : ''}`;
      bad.push(`${t[id]} (${range})`);
    }
  }
  const fridgeBad = Number.isNaN(v.fridgeHours) || v.fridgeHours < 0 || (v.fridgeHours !== 0 && v.fridgeHours > v.hours - 1);
  mark($id('fridgeHours'), fridgeBad);

  const reset = (message) => {
    ids.forEach((id) => ($id(id).textContent = DASH));
    $id('errorLine').textContent = message;
    $id('strengthNote').textContent = DASH;
    $id('yeastEquiv').textContent = DASH;
    $id('yeastExtraNote').textContent = '';
    render.lastResult = null;
  };

  if (bad.length || fridgeBad) {
    reset(t.check + [bad.join(', '), fridgeBad ? t.fridgeHint : ''].filter(Boolean).join('. ') + '.');
    return;
  }

  const r = compute(v);
  if (v.carryOver < 0 || v.carryOver > r.carryLimit) {
    mark($id('carryOver'), true);
    reset(t.carryLimit(dec(r.carryLimit)));
    return;
  }
  mark($id('carryOver'), false);
  $id('carryOver').max = r.carryLimit;
  const seg = document.querySelector('.seg');
  if (seg) seg.dataset.inert = v.carryOver > 0 ? 'false' : 'true';

  $id('outFlour').textContent = r.flour + ' g';
  $id('outWater').textContent = r.water + ' g';
  $id('outSalt').textContent = r.salt + ' g';
  $id('outFat').textContent = r.fat + ' g';
  $id('outCarry').textContent = r.carry + ' g';
  $id('outYeast').textContent = dec(r.yeast.toFixed(2)) + ' g';
  const tCopy = STRINGS[lang];
  $id('yeastEquiv').textContent = tCopy.yeastEquiv(dec((r.yeast / 3).toFixed(2)), dec((r.yeast / 3.5).toFixed(2)));
  render.lastResult = r;
  $id('outTotal').textContent = Math.round(r.totalDough) + ' g';
  // The label already carries the "(W)"; the value is just the number.
  $id('outStrength').textContent = String(r.strength);
  $id('yeastExtraNote').textContent = STRINGS[lang].yeastExtra(Math.round(r.totalDough));
  $id('strengthNote').textContent = t.notes[strengthBand(r.strength)](r.strength);
  $id('errorLine').textContent = '';
}

function applyLanguage(next) {
  lang = next;
  document.documentElement.lang = next;
  const t = STRINGS[next];
  document.title = STRINGS[next].title;
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const key = el.dataset.i18n;
    if (typeof t[key] === 'string') el.textContent = t[key];
  }
  for (const button of document.querySelectorAll('[data-lang]')) {
    button.setAttribute('aria-pressed', String(button.dataset.lang === next));
  }
  try { localStorage.setItem('calcolapizza.lang', next); } catch {}
  render();
  if (typeof writeUrl === 'function' && location.search !== undefined && document.readyState !== 'loading') writeUrl();
}

const onEdit = () => { render(); saveInputs(); writeUrl(); };
for (const el of document.querySelectorAll('input')) {
  el.addEventListener('input', onEdit);
  el.addEventListener('change', onEdit);
}
$id('resetBtn').addEventListener('click', () => { resetInputs(); writeUrl(); });

$id('copyLinkBtn').addEventListener('click', async () => {
  writeUrl();
  const ok = await copyText(location.href);
  if (ok) toast(STRINGS[lang].copiedLink);
  else showManualCopy(location.href);
});
$id('copyRecipeBtn').addEventListener('click', async () => {
  if (!render.lastResult) return;
  const text = recipeText(render.lastResult, readInputs());
  const ok = await copyText(text);
  if (ok) toast(STRINGS[lang].copiedRecipe);
  else showManualCopy(text);
});
for (const button of document.querySelectorAll('[data-lang]')) {
  button.addEventListener('click', () => applyLanguage(button.dataset.lang));
}

const saved = (() => { try { return localStorage.getItem('calcolapizza.lang'); } catch { return null; } })();
const langFromUrl = new URLSearchParams(location.search).get('l');
const preferred = (navigator.language || 'en').toLowerCase();
const detected = preferred.startsWith('da') ? 'da' : preferred.startsWith('de') ? 'de' : 'en';
const initial =
  langFromUrl && STRINGS[langFromUrl]
    ? langFromUrl
    : saved && STRINGS[saved]
      ? saved
      : detected;

// A shared link wins over whatever this browser remembered last.
const urlState = stateFromUrl();
if (urlState) applyState(urlState);
else restoreInputs();

applyLanguage(initial);
writeUrl();
</script>
</body>
</html>
